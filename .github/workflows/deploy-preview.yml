# 아래 작업본(게임 작업본 claude/battle-pokerogue, 개발자 메뉴 작업본 claude/dev-menu)에 새 버전이 올라오면,
# 아이가 쓰는 진짜 게임과는 별개인 미리보기 사이트(poke-quiz-preview, 기록 저장소도 따로)에 올립니다. 포켓로그(/battle)도 함께 만듭니다.
# 미리보기 사이트는 하나뿐이라, 마지막에 올린 작업본의 모습이 보입니다.
# 열쇠는 진짜 게임과 같은 CLOUDFLARE_API_TOKEN 을 씁니다.
name: 미리보기 올리기 (게임 작업본)

on:
  push:
    branches: [claude/battle-pokerogue, claude/dev-menu]
  workflow_dispatch:

concurrency:
  group: deploy-preview
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      WRANGLER_SEND_METRICS: 'false'
      CI: 'true'
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - uses: pnpm/action-setup@v4
        with:
          package_json_file: battle/package.json

      - name: 설치
        run: npm ci

      - name: 검사 (lint, typecheck, test)
        run: |
          npm run lint
          npm run typecheck
          npm test

      - name: 열쇠(토큰) 확인
        id: token
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::warning::CLOUDFLARE_API_TOKEN 이 아직 없어서 인터넷에 올리지 않았어요."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: 미리보기용 이름으로 바꾸기 (poke-quiz-preview / poke-quiz-preview-db)
        run: |
          sed -i 's/"name": "poke-quiz"/"name": "poke-quiz-preview"/; s/"database_name": "poke-quiz-db"/"database_name": "poke-quiz-preview-db"/' wrangler.jsonc
          grep -n '"name"\|database_name' wrangler.jsonc

      - name: 기록 저장소 준비 (없으면 만들고 번호 채우기 — 만들기 전에 해야 설정에 반영됨)
        if: steps.token.outputs.ready == 'true'
        run: |
          find_db() { npx wrangler d1 list --json 2>/dev/null | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const i=s.indexOf("[");const l=i<0?[]:JSON.parse(s.slice(i));const d=l.find(x=>x.name==="poke-quiz-preview-db");if(d)console.log(d.uuid)})'; }
          uuid=$(find_db)
          if [ -z "$uuid" ]; then
            echo "기록 저장소가 없어서 새로 만들어요."
            npx wrangler d1 create poke-quiz-preview-db
            uuid=$(find_db)
          fi
          [ -n "$uuid" ] || { echo "::error::기록 저장소 번호를 찾지 못했어요."; exit 1; }
          echo "기록 저장소 번호: $uuid"
          sed -i "s/\"database_id\": \"[^\"]*\"/\"database_id\": \"$uuid\"/" wrangler.jsonc

      - name: 만들기
        run: npm run build

      # 그림·소리(817MB, 3만 2천 개)와 압축한 배경음악은 한 번 받아 두고 다음 실행에서 재사용합니다.
      - name: 포켓로그 그림·소리 파일 캐시
        uses: actions/cache@v4
        with:
          path: |
            battle/assets
            battle/locales
          key: battle-assets-${{ hashFiles('lib/battle-assets.ts', 'scripts/build-battle.mjs', 'battle-extras/locales-ko/**') }}

      - name: ffmpeg 확인 (배경음악 압축용)
        run: ffmpeg -version | head -1 || (sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg)

      - name: 포켓로그(/battle) 만들기
        run: npm run build:battle

      - name: 기록 저장소 표 맞추기
        if: steps.token.outputs.ready == 'true'
        run: npx wrangler d1 migrations apply DB --remote

      - name: 인터넷에 올리기
        if: steps.token.outputs.ready == 'true'
        id: deploy
        run: |
          npx wrangler deploy | tee deploy.txt
          url=$(grep -oE 'https://[A-Za-z0-9.-]+\.workers\.dev' deploy.txt | head -1)
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "### 미리보기 주소: $url" >> "$GITHUB_STEP_SUMMARY"
          echo "포켓로그: $url/battle/" >> "$GITHUB_STEP_SUMMARY"

      - name: 올라간 버전 확인
        if: steps.token.outputs.ready == 'true'
        run: |
          url="${{ steps.deploy.outputs.url }}"
          [ -n "$url" ] || { echo "::error::게임 주소를 읽지 못했어요."; exit 1; }
          want=$(git rev-parse --short HEAD)
          for i in 1 2 3 4 5 6; do
            got=$(curl -fsS -D - -o /dev/null "$url/api/game" | tr -d '\r' | awk -F': ' 'tolower($1)=="x-app-version"{print $2}')
            echo "사이트 버전: ${got:-없음} / 올린 버전: $want"
            [ "$got" = "$want" ] && exit 0
            sleep 10
          done
          echo "::error::사이트 버전이 올린 버전과 달라요."
          exit 1
