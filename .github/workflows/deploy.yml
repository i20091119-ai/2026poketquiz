# 작업본에 새 버전이 올라오면 검사한 뒤 Cloudflare(인터넷)에 자동으로 올립니다.
# 처음 한 번, GitHub 저장소 설정 → Secrets and variables → Actions 에
# CLOUDFLARE_API_TOKEN 을 넣어 두어야 합니다 (README의 "자동으로 올리기" 참고).
name: 인터넷에 올리기

on:
  push:
    branches: [claude/vibrant-bell-ru08mi]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      WRANGLER_SEND_METRICS: 'false'
      CI: 'true'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: 설치
        run: npm ci

      - name: 검사 (lint, typecheck, test)
        run: |
          npm run lint
          npm run typecheck
          npm test

      - name: 만들기
        run: npm run build

      - name: 열쇠(토큰) 확인
        id: token
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::warning::CLOUDFLARE_API_TOKEN 이 아직 없어서 인터넷에 올리지 않았어요."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: 기록 저장소 표 맞추기
        if: steps.token.outputs.ready == 'true'
        run: npx wrangler d1 migrations apply DB --remote

      - name: 인터넷에 올리기
        if: steps.token.outputs.ready == 'true'
        run: npx wrangler deploy

      - name: 올라간 버전 확인
        if: steps.token.outputs.ready == 'true'
        run: |
          want=$(git rev-parse --short HEAD)
          for i in 1 2 3 4 5 6; do
            got=$(curl -fsS -D - -o /dev/null https://poke-quiz.qhfk8292.workers.dev/api/game | tr -d '\r' | awk -F': ' 'tolower($1)=="x-app-version"{print $2}')
            echo "사이트 버전: ${got:-없음} / 올린 버전: $want"
            [ "$got" = "$want" ] && exit 0
            sleep 10
          done
          echo "::error::사이트 버전이 올린 버전과 달라요."
          exit 1
